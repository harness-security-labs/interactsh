name: 🔨 Build Test

on:
  pull_request:
    paths:
      - '**.go'
      - '**.mod'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:  
  build:
    name: Test Builds
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26.x

      - name: Check out code
        uses: actions/checkout@v3

      - name: Build
        run: go build ./...
        working-directory: .
      
      - name: Test
        run: go test ./...
        working-directory: .

      - name: Race Condition Tests
        if: runner.os == 'Linux'
        run: go test -race ./...
        working-directory: .

      - name: Example Code Tests
        run: go build .
        working-directory: examples/
